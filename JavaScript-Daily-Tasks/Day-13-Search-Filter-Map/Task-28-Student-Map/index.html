<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Board</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: #312e81;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        #output {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(230px, 1fr)
                );

            gap: 25px;

            margin-top: 40px;
        }

        .card {

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);

            transition: 0.3s;

            text-align: left;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .card img {

            width: 100%;

            height: 210px;

            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .content h2 {

            margin-top: 0;

            color: #1e1b4b;
        }

        .mark {

            font-size: 24px;

            font-weight: bold;

            color: #7c3aed;
        }

        .result {

            display: inline-block;

            padding: 7px 14px;

            border-radius: 20px;

            background: #ede9fe;

            color: #6d28d9;

            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>🎓 Student Result Board</h1>

        <p class="subtitle">
            Student performance using JavaScript Map
        </p>

        <button onclick="showResults()">
            View Student Results
        </button>

        <div id="output"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
