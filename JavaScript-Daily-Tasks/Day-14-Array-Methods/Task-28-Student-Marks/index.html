<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Analyzer</title>
</head>
<body>

    <h1>Student Marks Analyzer</h1>

    <label>Enter Marks:</label>

    <input
        type="text"
        id="marksInput"
        placeholder="85,45,90,32,76,60"
    >

    <button onclick="analyzeMarks()">Analyze</button>

    <h3>All Marks:</h3>
    <p id="allMarks"></p>

    <h3>Passed Students:</h3>
    <p id="passed"></p>

    <h3>Failed Students:</h3>
    <p id="failed"></p>

    <h3>Highest Mark:</h3>
    <p id="highest"></p>

    <h3>Lowest Mark:</h3>
    <p id="lowest"></p>

    <h3>Total Marks:</h3>
    <p id="total"></p>

    <h3>Average Mark:</h3>
    <p id="average"></p>

    <script src="script.js"></script>

</body>
</html>
