<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Analyzer</title>
</head>
<body>

    <h1>Employee Salary Analyzer</h1>

    <label>Enter Employee Salaries:</label>

    <input
        type="text"
        id="salaryInput"
        placeholder="30000,45000,25000,60000,40000"
    >

    <button onclick="analyzeSalary()">Analyze</button>

    <h3>All Salaries:</h3>
    <p id="allSalaries"></p>

    <h3>Salaries Above 40000:</h3>
    <p id="aboveSalary"></p>

    <h3>Salaries Below 40000:</h3>
    <p id="belowSalary"></p>

    <h3>Highest Salary:</h3>
    <p id="highestSalary"></p>

    <h3>Lowest Salary:</h3>
    <p id="lowestSalary"></p>

    <h3>Total Salary:</h3>
    <p id="totalSalary"></p>

    <h3>Average Salary:</h3>
    <p id="averageSalary"></p>

    <script src="script.js"></script>

</body>
</html>
